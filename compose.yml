services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensepath}
      POSTGRES_USER: ${POSTGRES_USER:-sensepath_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensepath_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sensepath_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./datasets:/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sensepath_postgres_data:

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensepath_admin}:${POSTGRES_PASSWORD:-sensepath_local_only}@postgres:5432/${POSTGRES_DB:-sensepath}
      PORT: 5000
      MODERATOR_TOKEN: ${MODERATOR_TOKEN:-local_moderator_token_change_me}
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensepath}
      POSTGRES_USER: ${POSTGRES_USER:-sensepath_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensepath_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sensepath_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./datasets:/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sensepath_postgres_data:
